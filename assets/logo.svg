<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="キノピオAI 仮ロゴ">
  <!-- ============================================================
       仮ロゴ（差し替え前提）
       正式ロゴができたら、このファイルを同名の logo.svg / logo.png
       で上書きするだけで LP 全体に反映されます。
       HTML 側は <img src="assets/logo.svg"> で参照しています。
       ============================================================ -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b76"/>
      <stop offset="55%" stop-color="#ff4d5a"/>
      <stop offset="100%" stop-color="#c9283a"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6ea"/>
      <stop offset="100%" stop-color="#e0cdb6"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ff4d5a" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ff4d5a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="64" cy="60" r="60" fill="url(#halo)"/>

  <!-- 柄 -->
  <path d="M46 68 h36 c0 18 4 28 6 36 a52 52 0 0 1 -48 0 c2 -8 6 -18 6 -36 z"
        fill="url(#stem)"/>
  <!-- 柄の陰影 -->
  <path d="M46 68 h10 c-1 20 -3 30 -6 38 a54 54 0 0 1 -10 -2 c2 -8 6 -18 6 -36 z"
        fill="#000" opacity=".07"/>

  <!-- 傘 -->
  <path d="M64 10 C34 10 10 32 10 55 c0 8 6 13 16 13 h76 c10 0 16 -5 16 -13 C118 32 94 10 64 10 z"
        fill="url(#cap)"/>
  <!-- 傘のハイライト -->
  <path d="M40 22 C50 15 58 13 66 13 c-14 4 -22 12 -26 22 -2 5 -8 4 -7 -2 1 -4 3 -8 7 -11 z"
        fill="#fff" opacity=".28"/>

  <!-- 斑点 -->
  <circle cx="40" cy="40" r="9"  fill="#fff4e6" opacity=".95"/>
  <circle cx="86" cy="36" r="7"  fill="#fff4e6" opacity=".95"/>
  <circle cx="64" cy="54" r="6"  fill="#fff4e6" opacity=".95"/>
  <circle cx="103" cy="55" r="4.5" fill="#fff4e6" opacity=".9"/>
  <circle cx="24" cy="57" r="4"  fill="#fff4e6" opacity=".9"/>

  <!-- AI を示す音の粒（AI音楽×AI動画のモチーフ） -->
  <g fill="#0d0b10" opacity=".35">
    <rect x="52" y="76" width="3" height="8"  rx="1.5"/>
    <rect x="59" y="72" width="3" height="16" rx="1.5"/>
    <rect x="66" y="75" width="3" height="10" rx="1.5"/>
    <rect x="73" y="78" width="3" height="5"  rx="1.5"/>
  </g>
</svg>
