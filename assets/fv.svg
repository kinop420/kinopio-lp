<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 900" width="750" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="キノピオAI 仮キービジュアル">
  <!-- ============================================================
       仮キービジュアル（差し替え前提 / スマホ縦 5:6 想定）
       正式ビジュアルができたら assets/fv.jpg などを用意し、
       index.html の CSS 変数 --fv-image を差し替えてください。
         :root { --fv-image: url('assets/fv.jpg'); }
       ============================================================ -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a0f18"/>
      <stop offset="45%"  stop-color="#140d15"/>
      <stop offset="100%" stop-color="#0d0b10"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff4d5a" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff4d5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffb27a" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#ffb27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5d69"/>
      <stop offset="100%" stop-color="#a81f30"/>
    </linearGradient>
    <linearGradient id="capB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4d5a"/>
      <stop offset="100%" stop-color="#7d1626"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0d0b10" stop-opacity="0"/>
      <stop offset="70%" stop-color="#0d0b10" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#0d0b10" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="750" height="900" fill="url(#sky)"/>

  <!-- 背景の光 -->
  <ellipse cx="375" cy="430" rx="330" ry="300" fill="url(#glowRed)"/>
  <ellipse cx="150" cy="640" rx="200" ry="170" fill="url(#glowWarm)"/>

  <!-- 遠景の木立（シルエット） -->
  <g fill="#0a080d" opacity=".85">
    <path d="M60 900 V520 l18 -40 18 40 V900 z"/>
    <path d="M160 900 V470 l14 -34 14 34 V900 z"/>
    <path d="M600 900 V500 l16 -38 16 38 V900 z"/>
    <path d="M690 900 V560 l12 -30 12 30 V900 z"/>
  </g>

  <!-- 浮遊する胞子 -->
  <g fill="#ffd9b0">
    <circle cx="120" cy="210" r="2.5" opacity=".7"/>
    <circle cx="215" cy="130" r="1.8" opacity=".5"/>
    <circle cx="330" cy="240" r="2"   opacity=".6"/>
    <circle cx="470" cy="150" r="2.6" opacity=".65"/>
    <circle cx="565" cy="255" r="1.6" opacity=".45"/>
    <circle cx="645" cy="180" r="2.2" opacity=".55"/>
    <circle cx="80"  cy="330" r="1.7" opacity=".4"/>
    <circle cx="700" cy="380" r="2"   opacity=".5"/>
    <circle cx="410" cy="330" r="1.5" opacity=".4"/>
    <circle cx="255" cy="400" r="2.1" opacity=".45"/>
  </g>

  <!-- 波形（AI音楽のモチーフ） -->
  <g stroke="#ff4d5a" stroke-linecap="round" opacity=".5">
    <path d="M40 300 h60" stroke-width="3"/>
    <path d="M40 300 q30 -46 60 0 t60 0" fill="none" stroke-width="2.5" opacity=".55"/>
  </g>
  <g fill="#ffb27a" opacity=".45">
    <rect x="548" y="452" width="5" height="26" rx="2.5"/>
    <rect x="562" y="436" width="5" height="58" rx="2.5"/>
    <rect x="576" y="446" width="5" height="38" rx="2.5"/>
    <rect x="590" y="424" width="5" height="82" rx="2.5"/>
    <rect x="604" y="448" width="5" height="34" rx="2.5"/>
    <rect x="618" y="458" width="5" height="14" rx="2.5"/>
  </g>

  <!-- 小さいキノコ（左奥） -->
  <g transform="translate(120 640) scale(0.62)">
    <path d="M-18 0 h36 c0 34 5 52 9 66 a86 86 0 0 1 -54 0 c4 -14 9 -32 9 -66 z" fill="#e6d3ba" opacity=".9"/>
    <path d="M0 -78 C-44 -78 -76 -46 -76 -16 c0 10 8 16 22 16 h108 c14 0 22 -6 22 -16 C76 -46 44 -78 0 -78 z" fill="url(#capB)"/>
    <circle cx="-30" cy="-40" r="11" fill="#fff4e6" opacity=".9"/>
    <circle cx="24"  cy="-48" r="8"  fill="#fff4e6" opacity=".9"/>
    <circle cx="52"  cy="-24" r="6"  fill="#fff4e6" opacity=".85"/>
  </g>

  <!-- 主役のキノコ（中央） -->
  <g transform="translate(375 700)">
    <ellipse cx="0" cy="30" rx="150" ry="26" fill="#ff4d5a" opacity=".14"/>
    <path d="M-40 0 h80 c0 74 10 116 20 148 a190 190 0 0 1 -120 0 c10 -32 20 -74 20 -148 z" fill="#f3e2cb"/>
    <path d="M-40 0 h24 c-2 82 -8 124 -16 156 a186 186 0 0 1 -26 -8 c10 -32 18 -74 18 -148 z" fill="#000" opacity=".08"/>
    <path d="M0 -186 C-104 -186 -178 -110 -178 -40 c0 24 20 40 52 40 h252 c32 0 52 -16 52 -40 C178 -110 104 -186 0 -186 z" fill="url(#capA)"/>
    <path d="M-118 -118 C-88 -150 -54 -170 -20 -176 c-48 16 -78 48 -92 92 -6 18 -26 12 -22 -6 3 -10 16 -20 16 -28 z" fill="#fff" opacity=".22"/>
    <circle cx="-72" cy="-104" r="26" fill="#fff4e6"/>
    <circle cx="52"  cy="-124" r="20" fill="#fff4e6"/>
    <circle cx="10"  cy="-56"  r="15" fill="#fff4e6"/>
    <circle cx="128" cy="-56"  r="12" fill="#fff4e6" opacity=".95"/>
    <circle cx="-142" cy="-52" r="10" fill="#fff4e6" opacity=".95"/>
  </g>

  <!-- 小さいキノコ（右手前） -->
  <g transform="translate(608 760) scale(0.5)">
    <path d="M-18 0 h36 c0 34 5 52 9 66 a86 86 0 0 1 -54 0 c4 -14 9 -32 9 -66 z" fill="#e6d3ba" opacity=".9"/>
    <path d="M0 -78 C-44 -78 -76 -46 -76 -16 c0 10 8 16 22 16 h108 c14 0 22 -6 22 -16 C76 -46 44 -78 0 -78 z" fill="url(#capB)"/>
    <circle cx="-28" cy="-44" r="10" fill="#fff4e6" opacity=".9"/>
    <circle cx="28"  cy="-38" r="8"  fill="#fff4e6" opacity=".9"/>
  </g>

  <!-- 下端を背景色に溶かす -->
  <rect y="600" width="750" height="300" fill="url(#fade)"/>
</svg>
